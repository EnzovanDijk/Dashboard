<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kunst-Keuzehulp — Art Buyer Guide</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <span class="header-title">Kunst-Keuzehulp</span>
    <div class="header-controls">
      <button class="lang-toggle">EN</button>
      <button class="theme-toggle">◐</button>
    </div>
  </header>

  <!-- Progress -->
  <div class="progress-container" style="display:none">
    <div class="progress-bar" style="width:0%"></div>
  </div>

  <!-- Main -->
  <main class="main">
    <div class="progress-text" style="display:none"></div>

    <div id="screen-welcome" class="screen active"></div>
    <div id="screen-statements" class="screen"></div>
    <div id="screen-ab" class="screen"></div>
    <div id="screen-bridges" class="screen"></div>
    <div id="screen-filters" class="screen"></div>
    <div id="screen-results" class="screen"></div>
  </main>

  <!-- Scripts (order matters: data → engine → UI → app) -->
  <script src="js/i18n.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
